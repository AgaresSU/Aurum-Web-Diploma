{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AurumWeb{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20260829">
</head>
<body>
<header class="header">
    <div class="wrap header-row">
        <a class="logo" href="{% url 'home' %}">Aurum<span>Web</span></a>
        <ul class="menu">
            <li><a href="{% url 'home' %}">Главная</a></li>
            <li><a href="{% url 'services' %}">Услуги</a></li>
            <li><a href="{% url 'works' %}">Примеры</a></li>
            <li><a href="{% url 'brief' %}">Оставить заявку</a></li>
        </ul>
    </div>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <div class="wrap">
        <p>AurumWeb - разработка сайтов и автоматизация.</p>
    </div>
</footer>
</body>
</html>
