{% extends 'core/base.html' %}

{% block title %}Регистрация - AurumWeb{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap form-wrap">
        <p class="small-title">Личный кабинет</p>
        <h1>Регистрация</h1>
        <form method="post" class="brief-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Создать аккаунт</button>
        </form>
        <p>Уже зарегистрированы? <a class="text-link" href="{% url 'accounts:login' %}">Войти</a></p>
    </div>
</section>
{% endblock %}
