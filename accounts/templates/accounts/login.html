{% extends 'core/base.html' %}

{% block title %}Вход - AurumWeb{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap form-wrap">
        <p class="small-title">Личный кабинет</p>
        <h1>Вход</h1>
        <form method="post" class="brief-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a class="text-link" href="{% url 'accounts:register' %}">Зарегистрироваться</a></p>
    </div>
</section>
{% endblock %}
