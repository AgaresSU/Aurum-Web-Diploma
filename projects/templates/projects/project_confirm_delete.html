{% extends 'core/base.html' %}

{% block title %}Удаление проекта - AurumWeb{% endblock %}

{% block content %}
<section class="section">
    <div class="wrap form-wrap">
        <p class="small-title">Удаление</p>
        <h1>{{ project.title }}</h1>
        <p class="page-intro">Проект будет удалён без возможности восстановления.</p>
        <form method="post" class="brief-form">
            {% csrf_token %}
            <div class="actions">
                <button class="button danger-button" type="submit">Удалить</button>
                <a class="text-link" href="{% url 'projects:detail' project.pk %}">Отмена</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
